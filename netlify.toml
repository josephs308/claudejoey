# The site lives in kessler/, not the repo root, so Netlify needs to be told
# where to publish from. Without this a repo-connected deploy serves the root,
# which has no index.html.
[build]
  publish = "kessler"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Serve the homepage at / without changing any page's canonical URL.
[[redirects]]
  from = "/"
  to = "/authority-site.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/authority-site.html"
  status = 301
